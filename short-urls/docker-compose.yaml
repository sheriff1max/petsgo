version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: shorturls
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDR=:8080
      - STORAGE_TYPE=postgres
      - POSTGRES_DSN=postgres://user:pass@db:5432/shorturls?sslmode=disable
      - BASE_URL=http://localhost:8080
    depends_on:
      - db

volumes:
  pgdata: